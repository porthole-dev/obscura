[package]
name = "obscura"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[features]
# Development only: a fake camera and D-Bus hooks for build-aux/preview.
preview = []

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita", "gnome_49"] }
libcamera = "0.7"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-video = { package = "gstreamer-video", version = "0.25" }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "camera"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
libcamera-sys = "0.7"
smallvec = "1"


[profile.release]
lto = "fat"
codegen-units = 1
