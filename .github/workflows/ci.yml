name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/alpine:edge
      options: --security-opt seccomp=unconfined
    steps:
      - name: Dependencies
        run: |
          apk add --no-cache bash git build-base cargo rustfmt cargo-clippy clang-libclang pkgconf \
            gtk4.0-dev libadwaita-dev libcamera-dev gstreamer-dev gst-plugins-base-dev \
            gst-plugins-good gst-plugins-bad gst-plugins-ugly \
            mutter dbus at-spi2-core py3-atspi py3-gobject3 adwaita-icon-theme \
            font-dejavu font-cantarell mesa-dri-gallium glib-dev appstream desktop-file-utils gettext
          mkdir -m 700 -p /tmp/xdg
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --release --locked -- -D warnings
          cargo clippy --release --locked --features preview -- -D warnings
      - name: Unit tests
        run: cargo test --release --locked
      - name: UI checks (fake camera, headless mutter)
        env:
          XDG_RUNTIME_DIR: /tmp/xdg
        run: build-aux/preview/check.sh
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-check
          path: target/preview/check/
