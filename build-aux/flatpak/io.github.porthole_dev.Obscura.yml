# The sandboxed build, as Flathub would take it: cameras come through the
# Camera portal and PipeWire (src/pipewire.rs). libcamera is only linked,
# built with one small pipeline handler and no IPA modules.
#   flatpak-builder --user --install --force-clean build-aux/flatpak/build build-aux/flatpak/io.github.porthole_dev.Obscura.yml
id: io.github.porthole_dev.Obscura
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: obscura
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-pictures/Obscura:create
  - --filesystem=xdg-videos/Obscura:create
  - --talk-name=org.sigxcpu.Feedback
  - --system-talk-name=net.hadess.SensorProxy
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
modules:
  - python-deps.yml
  - name: libcamera
    buildsystem: meson
    config-opts:
      - -Dpipelines=uvcvideo
      - -Dipas=
      - -Dcam=disabled
      - -Dqcam=disabled
      - -Dgstreamer=disabled
      - -Dv4l2=false
      - -Dpycamera=disabled
      - -Ddocumentation=disabled
      - -Dlc-compliance=disabled
      - -Dtest=false
    sources:
      - type: git
        url: https://git.libcamera.org/libcamera/libcamera.git
        tag: v0.7.2
  - name: obscura
    buildsystem: meson
    config-opts: [-Dcargo_features=pipewire-controls]
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/obscura/cargo
        CARGO_NET_OFFLINE: "true"
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    sources:
      - type: dir
        path: ../..
        skip: [target, .git, .flatpak-builder]
      - cargo-sources.json
